databaseChangeLog:
  - preConditions:
      - runningAs:
          username: liquibase
  - changeSet:
      id: 1
      author: krajoff
      changes:
        - sqlFile:
            path: db/changelog/sql/init.sql
            relativeToChangelogFile: false
            encoding: UTF-8
            splitStatements: true
            stripComments: true
