<!DOCTYPE html>
<html lang="EN">
<head>
    <meta charset="UTF-8">
    <title>Units</title>
    <link rel="stylesheet" href="../../static/css/div-base.css"/>
    <link rel="stylesheet" href="../../static/css/div-units.css"/>
    <script src="../../static/js/edit/show.js"></script>
    <script src="../../static/js/edit/cancel.js"></script>
    <script src="../../static/js/unit/create.js"></script>
    <script src="../../static/js/unit/update.js"></script>
    <script src="../../static/js/unit/remove.js"></script>
</head>

<body>
<div class="container">

    <!-- Greeting -->
    <div class="greeting-bar">
        <div class="links-left">
            <a href="/stations">Stations</a>: Тестовая станция
        </div>
        <div class="links-right">
            <a href="/user" title="Profile">Profile</a>
            <form action="/logout" method="post">
                <input type="submit" value="Logout"/>
            </form>
        </div>
    </div>

    <!-- Units grid -->
    <div class="units-grid">

        <!-- Header -->
        <div class="unit-row unit-header">
            <div class="rowspan-2">No.</div>
            <div class="rowspan-2">Type</div>

            <div class="colspan-2 text-center">Weight</div>
            <div class="colspan-2 text-center">Vibration</div>

            <div class="rowspan-2">Description</div>
            <div class="rowspan-2">Created</div>
            <div class="rowspan-2">Modified</div>
            <div class="rowspan-2">Edit</div>

            <!--  Weight & Vibration -->
            <div class="sub-header">pr</div>
            <div class="sub-header">un</div>
            <div class="sub-header">pr</div>
            <div class="sub-header">un</div>
        </div>

        <!-- Example unit row -->
        <div class="unit-row">
            <div>2</div>
            <div>CB-536/123 2УХЛ</div>
            <div>2</div>
            <div>kg</div>
            <div>3</div>
            <div>mm/s</div>
            <div>Main balancing unit</div>
            <div>02.01.2026</div>
            <div>03.01.2026</div>
            <div>
                <button onclick="show(this)">Edit</button>
            </div>
        </div>

        <!-- Edit row  -->
        <div class="unit-row edit-row">
            <div>
                <input type="number" min="0" max="99" value="2"/>
            </div>
            <div>
                <input type="text" value="CB-536/123 2УХЛ"/>
            </div>
            <div>
                <select>
                    <option>0</option>
                    <option>1</option>
                    <option selected>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>
            <div>
                <select>
                    <option selected>kg</option>
                    <option>g</option>
                    <option>mg</option>
                </select>
            </div>
            <div>
                <select>
                    <option>0</option>
                    <option>1</option>
                    <option>2</option>
                    <option selected>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>
            </div>
            <div>
                <select>
                    <option>um</option>
                    <option selected>mm/s</option>
                    <option>m/s2</option>
                </select>
            </div>
            <div>
                <input type="text" value="Main balancing unit"/>
            </div>
            <div class="actions-cell">
                <button onclick="update(this)">Save</button>
                <button onclick="cancel(this)">Cancel</button>
                <button onclick="remove(this)">Delete</button>
            </div>
        </div>

        <!-- New unit row -->
        <div class="unit-row new-row">
            <div><input id="unitNumber" type="number" min="0" max="99" placeholder="1"/></div>
            <div><input id="unitType" type="text" placeholder="Unit type"/></div>
            <div>
                <select id="weightPrecision">
                    <option>0</option><option>1</option><option>2</option><option>3</option>
                    <option>4</option><option>5</option>
                </select>
            </div>
            <div>
                <select id="weightUnitMeasure">
                    <option>kg</option><option>g</option><option>mg</option>
                </select>
            </div>
            <div>
                <select id="vibrationPrecision">
                    <option>0</option><option>1</option><option>2</option><option>3</option>
                    <option>4</option><option>5</option>
                </select>
            </div>
            <div>
                <select id="vibrationUnitMeasure">
                    <option>um</option><option>mm/s</option><option>m/s2</option>
                </select>
            </div>
            <div><input id="description" type="text" placeholder="Description"/></div>
            <div class="actions-cell">
                <button onclick="create()">Add</button>
            </div>
        </div>

    </div>
</div>
</body>
</html>
