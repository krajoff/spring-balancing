<!DOCTYPE html>
<html lang="EN">
<head>
    <title>Units</title>
    <link rel="stylesheet" href="/css/other.css"/>
    <link rel="stylesheet" href="/css/table.css"/>
    <script src="/js/edit/show.js"></script>
    <script src="/js/edit/cancel.js"></script>
    <script> const stationId = '[[${station.id}]]';</script>
    <script src="/js/unit/create.js" defer></script>
    <script src="/js/unit/update.js"></script>
    <script src="/js/unit/remove.js"></script>
</head>

<body>
<div class="container">

    <!-- Greeting -->
    <div class="box greeting-bar">
        <div class="links-left">
            <a href="/stations">Stations</a>
        </div>
        <div class="links-right">
            <a href="/user" class="profile-link" title="Profile">Profile</a>
            <form action="/auth/logout" method="post">
                <input type="submit" value="Logout"/>
            </form>
        </div>
    </div>

    <!-- Unit table -->
    <div class="box">
        <table class="bordered" style="table-layout: fixed;">
            <colgroup>
                <col style="width: 70px;">   <!-- No -->
                <col style="width: 200px;">  <!-- Type -->
                <col style="width: 70px;">   <!-- Weight pr -->
                <col style="width: 80px;">   <!-- Weight un -->
                <col style="width: 70px;">   <!-- Vib pr -->
                <col style="width: 100px;">   <!-- Vib un -->

                <col style="width: 120px;">  <!-- Description -->
                <col style="width: 100px;">  <!-- Created -->
                <col style="width: 100px;">  <!-- Modified -->
                <col style="width: 70px;">   <!-- Edit -->
            </colgroup>

            <thead>
            <tr>
                <th rowspan="2">No.</th>
                <th rowspan="2">Type</th>

                <th colspan="2">Weight</th>
                <th colspan="2">Vibration</th>

                <th rowspan="2">Description</th>
                <th rowspan="2">Created</th>
                <th rowspan="2">Modified</th>
                <th rowspan="2">Edit</th>
            </tr>
            <tr>
                <th class="precision">pr</th>
                <th class="unit">un</th>
                <th class="precision">pr</th>
                <th class="unit">un</th>
            </tr>
            </thead>

            <tbody th:each="unit:${units}">
            <!-- Unit row -->
            <tr th:data-id="${unit.id}"
                th:attr="onclick=|window.location.href='/station/${station.id}/unit/${unit.id}';|"
                style="cursor: pointer;">
                <td th:text=${unit.unitNumber}></td>
                <td th:text=${unit.unitType}></td>
                <td class="precision" th:text=${unit.weightPrecision}></td>
                <td class="unit" th:text=${unit.weightUnitMeasure}></td>
                <td class="precision" th:text=${unit.vibrationPrecision}></td>
                <td class="unit" th:text=${unit.vibrationUnitMeasure}></td>
                <td th:text=${unit.description}></td>
                <td th:text="${#temporals.format(unit.createdOn, 'dd.MM.yyyy')}"></td>
                <td th:text="${#temporals.format(unit.updatedOn, 'dd.MM.yyyy')}"></td>
                <td>
                    <button type="button" th:onclick="|event.stopPropagation(); show(this);|">Edit</button>
                </td>
            </tr>

            <!-- Edit unit -->
            <tr class="edit-row">
                <td><input type="number" min="0" max="999" th:value="${unit.unitNumber}" class="edit-input"/></td>
                <td><input type="text" th:value="${unit.unitType}" class="edit-input"/></td>
                <td>
                    <select class="edit-input" th:value="${unit.weightPrecision}">
                        <option th:each="i : ${#numbers.sequence(0,5)}"
                                th:value="${i}" th:text="${i}"></option>
                    </select>
                </td>
                <td>
                    <select class="edit-input" th:value="${unit.weightUnitMeasure}">
                        <option value="kg" th:selected="${unit.weightUnitMeasure == 'kg'}">kg</option>
                        <option value="g" th:selected="${unit.weightUnitMeasure == 'g'}">g</option>
                        <option value="mg" th:selected="${unit.weightUnitMeasure == 'mg'}">mg</option>
                    </select>
                </td>
                <td>
                    <select class="edit-input" th:value="${unit.vibrationPrecision}">
                        <option th:each="i : ${#numbers.sequence(0,5)}"
                                th:value="${i}" th:text="${i}"></option>
                    </select>
                </td>
                <td>
                    <select class="edit-input" th:value="${unit.vibrationUnitMeasure}">
                        <option value="um" th:selected="${unit.vibrationUnitMeasure == 'um'}">um</option>
                        <option value="mm/s" th:selected="${unit.vibrationUnitMeasure == 'mm/s'}">mm/s</option>
                        <option value="m/s2" th:selected="${unit.vibrationUnitMeasure == 'm/s2'}">m/s2</option>
                    </select>
                </td>
                <td><input type="text" th:value="${unit.description}" class="edit-input"/></td>
                <td colspan="3" class="edit-actions">
                    <button type="button" class="btn-save" onclick="update(this)">Save</button>
                    <button class="btn-cancel" onclick="cancel(this); return false;">Cancel</button>
                    <button type="button" class="btn-delete" onclick="remove(this)">Delete</button>
                </td>
            </tr>
            </tbody>

            <!-- Add new unit -->
            <tr class="new-station-row">
                <td><input id="unitNumber" type="number" min="1" max="999" placeholder="1"/></td>
                <td><input id="unitType" type="text" placeholder="Unit type"/></td>
                <td>
                    <select id="weightPrecision">
                        <option>0</option>
                        <option th:each="i : ${#numbers.sequence(1,5)}" th:value="${i}" th:text="${i}"></option>
                    </select>
                </td>
                <td>
                    <select id="weightUnitMeasure">
                        <option value="kg">kg</option>
                        <option value="g">g</option>
                        <option value="mg">mg</option>
                    </select>
                </td>
                <td>
                    <select id="vibrationPrecision">
                        <option>0</option>
                        <option th:each="i : ${#numbers.sequence(1,5)}" th:value="${i}" th:text="${i}"></option>
                    </select>
                </td>
                <td>
                    <select id="vibrationUnitMeasure">
                        <option value="um">um</option>
                        <option value="mm/s">mm/s</option>
                        <option value="m/s2">m/s2</option>
                    </select>
                </td>
                <td><input id="description" type="text" placeholder="Description"/></td>
                <td colspan="3">
                    <button type="button" onclick="create()">Add</button>
                </td>
            </tr>

        </table>
    </div>
</div>
</body>
</html>
